# Smithery configuration for SABESP: Lista de Instalações
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_contas_sabesp_lista_instal

name: contas_sabesp_lista_instal-mcp
displayName: "SABESP: Lista de Instalações"
description: >
  SABESP: Lista de Instalações, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/contas_sabesp_lista_instal-mcp
repository: https://github.com/mcp-dir/contas_sabesp_lista_instal-mcp

tags:
  - contas_sabesp_lista_instal
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_contas_sabesp_lista_instal

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_contas_sabesp_lista_instal/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
